<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anything Goes — Ticket</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .ticket-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }
    .ticket-box {
      background: #0b0b0d;
      border: 1px solid #242428;
      max-width: 480px;
      width: 100%;
      padding: 32px 28px;
      text-align: center;
    }
    .ticket-box h1 {
      font-size: 42px;
      margin: 10px 0 6px;
    }
    .ticket-logo {
      width: 140px;
      margin: 0 auto 18px;
    }
    .password-form input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }
    .name-input {
      width: 100%;
      padding: 12px;
      margin: 16px 0 8px;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }
    .ticket-card {
      display: none;
      margin-top: 10px;
      padding: 24px 20px;
      border: 2px solid #9eff00;
      background: #0a0a0a;
    }
    .ticket-card.show { display: block; }
    .ticket-card .event-title {
      font: 700 28px Oswald, sans-serif;
      color: #9eff00;
      letter-spacing: 0.05em;
      margin: 8px 0;
    }
    .ticket-meta {
      color: #b9b2a8;
      font-size: 15px;
      line-height: 1.5;
      margin: 12px 0;
    }
    .guest-name {
      font: 700 22px Oswald, sans-serif;
      color: #fff;
      margin: 16px 0 8px;
      min-height: 28px;
    }
    .valid {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 16px;
      border: 1px solid #ed1c24;
      color: #ed1c24;
      font: 700 13px Oswald, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .error {
      color: #ed1c24;
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="ticket-page">
    <div class="ticket-box">
      <img src="assets/kink-korps-logo.png" alt="Kink Korps" class="ticket-logo">
      
      <div id="passwordSection">
        <p class="eyebrow">ANYTHING GOES</p>
        <h2 style="font-size:32px;margin:8px 0 16px;">Enter Password</h2>
        <p style="color:#b9b2a8;font-size:15px;margin-bottom:16px;">After paying, enter the password you received.</p>
        
        <div class="password-form">
          <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
          <button class="ticket-button" onclick="checkPassword()" style="width:100%;margin-top:8px;">Unlock Ticket</button>
          <p class="error" id="errorMsg">Wrong password</p>
        </div>
      </div>

      <div class="ticket-card" id="ticketCard">
        <p class="eyebrow">KINK KORPS PRESENTS</p>
        <div class="event-title">ANYTHING GOES</div>
        <div class="ticket-meta">
          Friday, August 28 • 10:00 PM – 4:00 AM<br>
          Nu Vibez • 1745 NW 38th Ave
        </div>
        
        <input type="text" class="name-input" id="guestName" placeholder="Type your name here" oninput="updateName()">
        <div class="guest-name" id="displayName">YOUR NAME</div>
        
        <div class="valid">Valid for Entry</div>
        <p style="color:#666;font-size:12px;margin-top:18px;">Screenshot this ticket and show it at the door</p>
      </div>
    </div>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById('passwordInput').value.trim();
      const error = document.getElementById('errorMsg');
      
      if (input === 'ATG2026') {
        document.getElementById('passwordSection').style.display = 'none';
        document.getElementById('ticketCard').classList.add('show');
        error.style.display = 'none';
      } else {
        error.style.display = 'block';
      }
    }

    function updateName() {
      const name = document.getElementById('guestName').value.trim();
      document.getElementById('displayName').textContent = name || 'YOUR NAME';
    }

    // Allow Enter key
    document.getElementById('passwordInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
